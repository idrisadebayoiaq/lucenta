# Supabase pauses free projects after 7 days without API traffic.
# This pings the REST API every hour so the project stays active.
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          url="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          key="$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '[:space:]')"
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets."
            exit 1
          fi
          status="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 \
            -H "apikey: $key" "$url/rest/v1/developers?select=id&limit=1")"
          echo "Supabase responded with HTTP $status"
          [ "$status" = "200" ]
